<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portofolio Profil</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --led-colors: #ff0000, #00ff00, #0000ff, #ffff00, #ff00ff, #00ffff;
    }
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #ffffff;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .led {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      box-shadow: 0 0 10px currentColor;
    }
    .led-container {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .profile-link {
      margin-bottom: 1rem;
      display: block;
      font-size: 1.2rem;
      color: inherit;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }
    .buttons button {
      background-color: lightblue;
      border: none;
      color: #000;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .buttons button:hover {
      transform: scale(1.1);
    }
    .theme-toggle {
      margin-top: 2rem;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
    Browser Anda tidak mendukung audio.
  </audio>

  <div class="led-container" id="ledContainer"></div>

  <a href="#" class="profile-link">Kunjungi Profil Saya</a>

  <div class="buttons">
    <button style="border-radius: 0;">Login</button>
    <button style="border-radius: 50%;">Login</button>
    <button style="border-radius: 10px;">Login</button>
    <button style="border-radius: 5px 15px;">Login</button>
    <button style="border-radius: 0 20px;">Login</button>
    <button style="border-radius: 20px 0;">Login</button>
    <button style="border-radius: 25%;">Login</button>
    <button style="border-radius: 15px;">Login</button>
    <button style="border-radius: 30px;">Login</button>
    <button style="border-radius: 100px;">Login</button>
  </div>

  <button class="theme-toggle" onclick="toggleTheme()">Ganti Mode Tema</button>

  <script>
    // LED Warna-warni
    const ledContainer = document.getElementById('ledContainer');
    const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
    const leds = [];

    for (let i = 0; i < 6; i++) {
      const led = document.createElement('div');
      led.classList.add('led');
      led.style.color = colors[i];
      leds.push(led);
      ledContainer.appendChild(led);
    }

    let index = 0;
    setInterval(() => {
      leds.forEach((led, i) => {
        let colorIndex = (index + i) % colors.length;
        led.style.color = colors[colorIndex];
      });
      index++;
    }, 500);

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</body>
</html>
